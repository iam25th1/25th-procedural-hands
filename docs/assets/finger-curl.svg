<svg xmlns="http://www.w3.org/2000/svg" width="360" height="220" viewBox="0 0 360 220" role="img" aria-labelledby="t d">
  <title id="t">A finger curling</title>
  <desc id="d">An index finger seen from the side: the proximal, middle and distal phalanges flex at the MCP, PIP and DIP joints, the DIP following the PIP at two thirds, then open again.</desc>
  <rect width="360" height="220" fill="#15171A"/>
  <!-- Metacarpal and palm edge -->
  <rect x="20" y="100" width="100" height="26" rx="13" fill="#8C969B"/>
  <g transform="translate(112 113)">
    <!-- MCP: 0 to 80 degrees -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;80;80;0;0" keyTimes="0;0.35;0.55;0.9;1" dur="3.2s" repeatCount="indefinite"/>
      <rect x="0" y="-12" width="86" height="24" rx="12" fill="#F1F0EB"/>
      <g transform="translate(78 0)">
        <!-- PIP: 0 to 95 degrees -->
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;95;95;0;0" keyTimes="0;0.35;0.55;0.9;1" dur="3.2s" repeatCount="indefinite"/>
          <rect x="0" y="-11" width="56" height="22" rx="11" fill="#F1F0EB"/>
          <g transform="translate(50 0)">
            <!-- DIP follows the PIP at two thirds -->
            <g>
              <animateTransform attributeName="transform" type="rotate" values="0;63;63;0;0" keyTimes="0;0.35;0.55;0.9;1" dur="3.2s" repeatCount="indefinite"/>
              <rect x="0" y="-10" width="40" height="20" rx="10" fill="#F1F0EB"/>
              <rect x="22" y="-10" width="16" height="6" rx="3" fill="#8C969B"/>
            </g>
            <circle r="5" fill="#F2B705"/>
          </g>
        </g>
        <circle r="5.5" fill="#F2B705"/>
      </g>
    </g>
    <circle r="6" fill="#F2B705"/>
  </g>
  <text x="20" y="200" fill="#8C969B" font-family="'Barlow Condensed', 'Arial Narrow', sans-serif" font-size="16">MCP, PIP and DIP in yellow; DIP follows the PIP at two thirds</text>
</svg>
