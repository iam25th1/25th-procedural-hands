# The machine-independent gate on every push and pull request to main:
# npm run gate:ci (check, unit tests, hands:check and hands:matrix with
# --set=ci, npm audit). The device-dependent checks (wall-clock budgets
# measured on one machine, and the video renders' time limit) cannot be
# met on shared runners and are run only by npm run gate on the device;
# CONTRIBUTING.md says which and why. The browser checks need Playwright's
# Chromium, which npm ci --ignore-scripts does not download, so it is
# installed here.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x64 and arm64 Linux and arm64 macOS: the simulation must replay
        # to the same bits on each (docs/dev-notes/HANDS_X64_REPLAY.md).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run gate:ci
